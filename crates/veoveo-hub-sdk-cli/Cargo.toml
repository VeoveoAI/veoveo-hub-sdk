[package]
name = "veoveo-hub-sdk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_hub_sdk_cli"
path = "src/lib.rs"

[[bin]]
name = "veoveo-hub-sdk-cli"
path = "src/main.rs"

[dependencies]
veoveo-hub-sdk = { workspace = true, features = ["client-credentials"] }
veoveo-types.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
url.workspace = true

[dev-dependencies]
axum.workspace = true
uuid.workspace = true

[lints]
workspace = true
