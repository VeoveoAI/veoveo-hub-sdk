[package]
name = "veoveo-hub-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_hub_sdk"
path = "src/lib.rs"

[features]
default = ["server"]
# Declarations and wire types only: no rmcp, async runtime, HTTP stack or database.
contract = []
# Typed calls to servers through a Hub profile over MCP Streamable HTTP.
client = [
    "contract",
    "dep:futures",
    "dep:reqwest",
    "dep:rmcp",
    "rmcp/client",
    "rmcp/transport-streamable-http-client-reqwest",
    "dep:sse-stream",
    "dep:tokio",
]
# A caller's own client-credentials bearer, requested with an RFC 7523 assertion signed
# by the caller's key, for programs that call a Hub profile in their own name.
client-credentials = ["client", "dep:veoveo-oauth"]
# Hosting, transport, forwarded-token verification, the registration client, MCP Apps,
# the MCP Tasks adapter over core's durable Task runtime and calls to other servers for
# the current caller.
server = [
    "client",
    "rmcp/server",
    "rmcp/schemars",
    "rmcp/transport-streamable-http-server",
    "dep:anyhow",
    "dep:aws-lc-rs",
    "dep:axum",
    "dep:futures",
    "dep:hex",
    "dep:jsonschema",
    "dep:jsonwebtoken",
    "dep:opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:parking_lot",
    "dep:reqwest",
    "dep:rmcp",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:veoveo-store",
    "dep:veoveo-task",
    "dep:veoveo-usage",
]
# An in-process Hub for server tests, `hosting::testing`, and the checks servers run
# as tests, `testing`.
testing = ["server", "dep:tower", "dep:pg_query", "dep:proc-macro2", "dep:syn"]

[dependencies]
veoveo-hub-sdk-macros = { path = "../veoveo-hub-sdk-macros" }
veoveo-audit-contract.workspace = true
veoveo-oauth = { workspace = true, optional = true }
veoveo-types.workspace = true
veoveo-usage-contract.workspace = true
base64.workspace = true
chrono.workspace = true
schemars = { workspace = true, features = ["chrono04", "uuid1", "url2"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7"] }

anyhow = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
pg_query = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking", "rustls-no-provider"] }
rmcp = { workspace = true, optional = true }
sse-stream = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
veoveo-store = { workspace = true, optional = true }
veoveo-task = { workspace = true, optional = true }
veoveo-usage = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
jsonschema.workspace = true
pg_query.workspace = true
proc-macro2.workspace = true
rmcp = { workspace = true, features = ["client", "macros", "server", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
syn.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tower.workspace = true
uuid.workspace = true

[[test]]
name = "apps"
required-features = ["testing"]

[[test]]
name = "registration_client"
required-features = ["server"]

[[test]]
name = "registration_wire"
required-features = ["server"]

[[test]]
name = "server_contract"
required-features = ["server"]

[[test]]
name = "streamable_notifications"
required-features = ["server"]

[lints]
workspace = true
