[package]
name = "veoveo-sdk-rust-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_sdk_rust_cli"
path = "src/lib.rs"

[[bin]]
name = "veoveo-sdk-rust-cli"
path = "src/main.rs"

[dependencies]
veoveo-oauth-client.workspace = true
veoveo-sdk-rust-conformance.workspace = true
veoveo-types.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
url.workspace = true

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
