[package]
name = "veoveo-sdk-rust-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_sdk_rust_conformance"
path = "src/lib.rs"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bin]]
name = "certify"
path = "src/bin/certify.rs"

[dependencies]
veoveo-sdk-rust = { workspace = true, features = ["server"] }
veoveo-types.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
jsonschema.workspace = true
jsonwebtoken.workspace = true
oauth2.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rmcp = { workspace = true, features = ["auth", "server", "client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-tls-no-provider"] }
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen.workspace = true
veoveo-sdk-rust-fixture.workspace = true

[lints]
workspace = true
