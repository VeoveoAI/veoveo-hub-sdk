[package]
name = "veoveo-sdk-rust-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["server"]
contract = [
    "dep:thiserror",
    "dep:veoveo-types",
    "dep:schemars",
    "dep:veoveo-sdk-rust",
]
server = [
    "contract",
    "dep:anyhow",
    "dep:aws-lc-rs",
    "dep:axum",
    "dep:chrono",
    "dep:futures",
    "dep:hex",
    "dep:parking_lot",
    "dep:reqwest",
    "dep:rmcp",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
    "dep:veoveo-task",
    "veoveo-sdk-rust/server",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true, optional = true }
veoveo-types = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
veoveo-sdk-rust = { workspace = true, features = ["contract"], optional = true }
anyhow = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server", "macros"], optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-task = { workspace = true, optional = true }

[dev-dependencies]
rustls.workspace = true
veoveo-store.workspace = true
veoveo-fixtures = { workspace = true, features = ["store"] }
veoveo-sdk-rust = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "contract"
required-features = ["contract"]

[[test]]
name = "calls"
required-features = ["server"]

[[test]]
name = "operations"
required-features = ["server"]

[[test]]
name = "worker"
required-features = ["server"]

[lints]
workspace = true
