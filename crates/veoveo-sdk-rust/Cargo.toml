[package]
name = "veoveo-sdk-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "veoveo_sdk_rust"
path = "src/lib.rs"

[features]
default = ["server"]
# Declarations and wire types only: no rmcp, async runtime, HTTP stack or database.
contract = []
# Typed calls to servers through a Gateway profile over MCP Streamable HTTP.
client = [
    "contract",
    "dep:futures",
    "dep:reqwest",
    "dep:rmcp",
    "rmcp/client",
    "rmcp/transport-streamable-http-client-reqwest",
    "dep:sse-stream",
    "dep:tokio",
]
# Hosting, transport, forwarded-token verification, the registration client, MCP Apps,
# the MCP Tasks adapter over core's durable Task runtime and calls to other servers for
# the current caller.
server = [
    "client",
    "rmcp/server",
    "rmcp/transport-streamable-http-server",
    "dep:anyhow",
    "dep:aws-lc-rs",
    "dep:axum",
    "dep:futures",
    "dep:hex",
    "dep:jsonwebtoken",
    "dep:opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:parking_lot",
    "dep:reqwest",
    "dep:rmcp",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:veoveo-task-runtime",
]
# An in-process Gateway for server tests: `hosting::testing`.
testing = ["server", "dep:tower"]

[dependencies]
veoveo-audit-contract.workspace = true
veoveo-types.workspace = true
base64.workspace = true
chrono.workspace = true
schemars = { workspace = true, features = ["chrono04", "uuid1", "url2"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7"] }

anyhow = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking", "rustls-no-provider"] }
rmcp = { workspace = true, optional = true, features = ["schemars"] }
sse-stream = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["full"] }
tokio-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
veoveo-task-runtime = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
jsonschema.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls.workspace = true
tokio = { workspace = true, features = ["full"] }
tower.workspace = true
uuid.workspace = true

[[test]]
name = "registration_client"
required-features = ["server"]

[[test]]
name = "registration_wire"
required-features = ["server"]

[[test]]
name = "server_contract"
required-features = ["server"]

[[test]]
name = "streamable_notifications"
required-features = ["server"]

[lints]
workspace = true
